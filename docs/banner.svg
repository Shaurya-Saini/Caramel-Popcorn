<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="Caramel Popcorn">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF9EF"/>
      <stop offset="1" stop-color="#F6EDD6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4C430"/>
      <stop offset="1" stop-color="#E0A81E"/>
    </linearGradient>
    <clipPath id="card"><rect x="0" y="0" width="1200" height="340" rx="26"/></clipPath>
    <clipPath id="bucket"><path d="M900,155 L1092,155 L1068,300 L924,300 Z"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="1200" height="340" fill="url(#bg)"/>
    <rect x="0" y="0" width="14" height="340" fill="url(#accent)"/>

    <!-- popcorn bucket -->
    <path d="M900,155 L1092,155 L1068,300 L924,300 Z" fill="#FFF7E6"/>
    <g clip-path="url(#bucket)">
      <rect x="892" y="150" width="22" height="156" fill="#D7263D"/>
      <rect x="936" y="150" width="22" height="156" fill="#D7263D"/>
      <rect x="980" y="150" width="22" height="156" fill="#D7263D"/>
      <rect x="1024" y="150" width="22" height="156" fill="#D7263D"/>
      <rect x="1068" y="150" width="22" height="156" fill="#D7263D"/>
    </g>
    <path d="M900,155 L1092,155 L1068,300 L924,300 Z" fill="none" stroke="#C9BFA6" stroke-width="1.5"/>
    <rect x="886" y="146" width="220" height="20" rx="7" fill="#E8455A"/>
    <rect x="886" y="146" width="220" height="7" rx="3.5" fill="#F06A7C"/>

    <!-- popcorn kernels -->
    <g fill="#FCEEB0" stroke="#E7CE73" stroke-width="1.4">
      <g><circle cx="935" cy="132" r="14"/><circle cx="926" cy="124" r="9"/><circle cx="944" cy="124" r="9"/><circle cx="926" cy="139" r="8"/><circle cx="944" cy="139" r="8"/><circle cx="935" cy="119" r="8"/></g>
      <g><circle cx="975" cy="108" r="15"/><circle cx="965" cy="100" r="9"/><circle cx="985" cy="100" r="9"/><circle cx="965" cy="115" r="8"/><circle cx="985" cy="115" r="8"/><circle cx="975" cy="94" r="8"/></g>
      <g><circle cx="1015" cy="120" r="14"/><circle cx="1006" cy="112" r="9"/><circle cx="1024" cy="112" r="9"/><circle cx="1006" cy="127" r="8"/><circle cx="1024" cy="127" r="8"/><circle cx="1015" cy="107" r="8"/></g>
      <g><circle cx="1055" cy="132" r="13"/><circle cx="1047" cy="125" r="8"/><circle cx="1063" cy="125" r="8"/><circle cx="1047" cy="139" r="7"/><circle cx="1063" cy="139" r="7"/><circle cx="1055" cy="120" r="7"/></g>
      <g><circle cx="955" cy="88" r="13"/><circle cx="947" cy="81" r="8"/><circle cx="963" cy="81" r="8"/><circle cx="947" cy="95" r="7"/><circle cx="963" cy="95" r="7"/><circle cx="955" cy="76" r="7"/></g>
      <g><circle cx="998" cy="78" r="14"/><circle cx="989" cy="70" r="8"/><circle cx="1007" cy="70" r="8"/><circle cx="989" cy="85" r="7"/><circle cx="1007" cy="85" r="7"/><circle cx="998" cy="65" r="8"/></g>
      <g><circle cx="1040" cy="90" r="13"/><circle cx="1032" cy="83" r="8"/><circle cx="1048" cy="83" r="8"/><circle cx="1032" cy="97" r="7"/><circle cx="1048" cy="97" r="7"/><circle cx="1040" cy="78" r="7"/></g>
    </g>
  </g>

  <!-- wordmark -->
  <text x="74" y="150" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="66" font-weight="800" fill="#3A2E1E" letter-spacing="-1">Caramel Popcorn</text>
  <rect x="76" y="170" width="240" height="8" rx="4" fill="url(#accent)"/>
  <text x="76" y="214" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" fill="#7A6A52">A popcorn-themed food-review and recommendation platform</text>
  <text x="76" y="250" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#A38F68">Rate places  ·  tag favourite items  ·  discover what is nearby</text>
</svg>
